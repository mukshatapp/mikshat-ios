workflows:
  mikshat-ios-simulator:
    name: Mikshat iOS - first simulator build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        XCODE_WORKSPACE: xcode/omim.xcworkspace
        XCODE_SCHEME: OMaps
    scripts:
      - name: Prepare Mikshat branding and check navigation math
        script: |
          set -euo pipefail
          python3 mikshat/prepare_branding.py
          python3 mikshat/prepare_satellite.py
          swiftc iphone/Maps/UI/Mikshat/MikshatNavigationMath.swift mikshat/tests/NavigationMathTests.swift -o /tmp/mikshat-navigation-tests
          /tmp/mikshat-navigation-tests
          clang -std=c11 -Wall -Wextra -Wno-cast-function-type mikshat/tests/ThemeSwizzleRuntimeTests.c -lobjc -o /tmp/mikshat-theme-runtime-tests
          /tmp/mikshat-theme-runtime-tests
          bash mikshat/tests/weather-data/run.sh
          python3 -m unittest discover -s tools/python/mikshat -p 'test_*.py'
      - name: Check Xcode and Metal
        script: |
          set -euo pipefail
          xcodebuild -version
          if ! xcrun metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -k
          fi
          xcrun metal -v
      - name: Download pinned dependencies
        script: |
          set -euo pipefail
          git submodule update --init --recursive --depth 1 --jobs 8
      - name: Build for iOS Simulator without signing
        script: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Mikshat-Build.xcresult \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log
      - name: Package simulator application
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          apps = list(Path("build/DerivedData/Build/Products/Debug-iphonesimulator").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(f"Expected one simulator app; found {len(apps)}")
          subprocess.run(["ditto", "-c", "-k", "--sequesterRsrc", "--keepParent",
                          str(apps[0]), "build/Mikshat-Simulator.zip"], check=True)
          PY
    artifacts:
      - build/Mikshat-Simulator.zip
      - build/xcodebuild.log
      - build/Mikshat-Build.xcresult

  mikshat-ios-testflight:
    name: Mikshat iOS - signed TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: release/4.6.21
          include: true
          source: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: Mikshat-Codemagic
    environment:
      xcode: "27.0"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mikshat.maps
      vars:
        APP_STORE_APPLE_ID: "6828427541"
        XCODE_WORKSPACE: xcode/omim.xcworkspace
        XCODE_SCHEME: OMaps
        APP_VERSION: "4.6.21"
    scripts:
      - name: Prepare Mikshat branding and check navigation math
        script: |
          set -euo pipefail
          python3 mikshat/prepare_branding.py
          python3 mikshat/prepare_satellite.py
          swiftc iphone/Maps/UI/Mikshat/MikshatNavigationMath.swift mikshat/tests/NavigationMathTests.swift -o /tmp/mikshat-navigation-tests
          /tmp/mikshat-navigation-tests
          clang -std=c11 -Wall -Wextra -Wno-cast-function-type mikshat/tests/ThemeSwizzleRuntimeTests.c -lobjc -o /tmp/mikshat-theme-runtime-tests
          /tmp/mikshat-theme-runtime-tests
          bash mikshat/tests/weather-data/run.sh
          python3 -m unittest discover -s tools/python/mikshat -p 'test_*.py'
      - name: Check Xcode and Metal
        script: |
          set -euo pipefail
          python3 mikshat/tests/update-native/prepare_metal.py build/metal-preflight
      - name: Download pinned dependencies
        script: |
          set -euo pipefail
          git submodule update --init --recursive --depth 1 --jobs 8
      - name: Verify Arabic and English features before TestFlight upload
        script: |
          set -euo pipefail
          python3 -m unittest discover -s mikshat/tests/update-native -p 'test_*.py'
          python3 mikshat/tests/update-native/rotation_diagnostic.py --production build/rotation-verification
          python3 mikshat/tests/update-native/vehicle_routing.py --products build/RotationDiagnosticDerivedData/Build/Products --output-dir build/vehicle-routing-verification
      - name: Apply distribution provisioning profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles --project iphone/Maps/Maps.xcodeproj
      - name: Set app and widget versions
        script: |
          set -euo pipefail
          # Query this release train; the highest marketing version may have a
          # lower build number than a previously uploaded release.
          LATEST_TESTFLIGHT_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --pre-release-version "$APP_VERSION" --platform IOS)
          LATEST_APP_STORE_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" --app-store-version "$APP_VERSION" --platform IOS)
          NEXT_BUILD_NUMBER=$(python3 - "${LATEST_TESTFLIGHT_BUILD_NUMBER:-0}" "${LATEST_APP_STORE_BUILD_NUMBER:-0}" "${PROJECT_BUILD_NUMBER:?Codemagic project build counter is required}" <<'PY'
          import re
          import sys
          values = [value.strip() for value in sys.argv[1:]]
          if any(not re.fullmatch(r"[0-9]+", value) for value in values):
              raise SystemExit("Expected integer Apple build numbers and a Codemagic project counter")
          testflight, app_store, project = map(int, values)
          if project < 1:
              raise SystemExit("Codemagic project build counter must be positive")
          # Continue above the known uploaded build 2 and use the app-wide CI
          # counter as a floor when Apple has not exposed a recent upload yet.
          print(max(3, testflight + 1, app_store + 1, project))
          PY
          )
          printf 'MIKSHAT_BUILD_NUMBER=%s\n' "$NEXT_BUILD_NUMBER" >> "$CM_ENV"
          printf 'Preparing Mikshat %s (%s), commit %s\n' "$APP_VERSION" "$NEXT_BUILD_NUMBER" "${CM_COMMIT:-unknown}"
          cd iphone/Maps
          agvtool new-version -all "$NEXT_BUILD_NUMBER"
          agvtool new-marketing-version "$APP_VERSION"
      - name: Archive and export signed IPA
        script: |
          set -euo pipefail
          # Prefer raw compiler diagnostics over the abbreviated xcpretty output.
          BUILD_IPA_HELP="$(xcode-project build-ipa --help)"
          if [[ "$BUILD_IPA_HELP" == *"--disable-xcpretty"* ]]; then
            set -- --disable-xcpretty
          else
            set --
          fi
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO MARKETING_VERSION=$APP_VERSION CURRENT_PROJECT_VERSION=$MIKSHAT_BUILD_NUMBER" \
            --config Release "$@" 2>&1 | tee /tmp/mikshat-archive.log
      - name: Validate versions in signed IPA
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import plistlib
          import re
          import zipfile
          original_ipas = list(Path("build/ios/ipa").glob("*.ipa"))
          # Only validated files retain the extension collected for publishing.
          ipas = [path.with_suffix(".ipa.rejected") for path in original_ipas]
          for original, candidate in zip(original_ipas, ipas):
              original.replace(candidate)
          if len(ipas) != 1:
              raise SystemExit(f"Expected one IPA, found {len(ipas)}")
          errors = []
          expected_versions = {"CFBundleShortVersionString": os.environ["APP_VERSION"],
                               "CFBundleVersion": os.environ["MIKSHAT_BUILD_NUMBER"]}
          required_bundles = {"com.mikshat.maps", "com.mikshat.maps.widgetextension"}
          found_bundles = set()
          with zipfile.ZipFile(ipas[0]) as archive:
              for name in archive.namelist():
                  if not re.search(r"\.(app|appex|framework)/Info\.plist$", name):
                      continue
                  info = plistlib.loads(archive.read(name))
                  for key in ("CFBundleShortVersionString", "CFBundleVersion"):
                      value = info.get(key, "")
                      if not isinstance(value, str) or not re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,2}", value):
                          errors.append(f"{name}: invalid {key}={value!r}")
                  if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", name):
                      expected_bundle = "com.mikshat.maps"
                  elif re.fullmatch(r"Payload/[^/]+\.app/PlugIns/[^/]+\.appex/Info\.plist", name):
                      expected_bundle = "com.mikshat.maps.widgetextension"
                  else:
                      continue
                  bundle = info.get("CFBundleIdentifier")
                  if bundle != expected_bundle:
                      errors.append(f"{name}: expected bundle {expected_bundle}, found {bundle!r}")
                  else:
                      found_bundles.add(bundle)
                  for key, expected in expected_versions.items():
                      if info.get(key) != expected:
                          errors.append(f"{name}: expected {key}={expected!r}, found {info.get(key)!r}")
                  print(f"{name}: version={info.get('CFBundleShortVersionString')}, build={info.get('CFBundleVersion')}")
          for bundle in sorted(required_bundles - found_bundles):
              errors.append(f"Missing required bundle: {bundle}")
          if errors:
              raise SystemExit("\n".join(errors))
          ipas[0].replace(original_ipas[0])
          PY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/mikshat-archive.log
      - build/metal-preflight/preflight.log
      - build/metal-preflight/summary.json
      - build/rotation-verification/rotation-diagnostics.zip
      - build/rotation-verification/summary.json
      - build/vehicle-routing-verification/*.json
      - build/vehicle-routing-verification/*.jsonl
      - build/vehicle-routing-verification/*.log
      - build/vehicle-routing-verification/screenshots/captures.jsonl
      - build/vehicle-routing-verification/native-stacks/**
      - build/ios/xcarchive/*.xcarchive/dSYMs/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  mikshat-ios-rotation-diagnostics:
    name: Mikshat iOS - selected point rotation diagnostics
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: fix/selected-point-rotation-diagnostics
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      xcode: "27.0"
      vars:
        XCODE_WORKSPACE: xcode/omim.xcworkspace
        XCODE_SCHEME: OMaps
    scripts:
      - name: Prepare Mikshat app resources
        script: |
          set -euo pipefail
          python3 mikshat/prepare_branding.py
          python3 mikshat/prepare_satellite.py
      - name: Download pinned dependencies
        script: |
          set -euo pipefail
          git submodule update --init --recursive --depth 1 --jobs 8
      - name: Check Xcode and Metal
        script: |
          set -euo pipefail
          xcodebuild -version
          if ! xcrun metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -k
          fi
          xcrun metal -v
      - name: Compare selected point layouts and capture blocked thread stacks
        script: |
          set -euo pipefail
          bash mikshat/tests/update-native/run_rotation_diagnostic.sh build/rotation-diagnostic
    artifacts:
      - build/rotation-diagnostic/rotation-diagnostics.zip
      - build/rotation-diagnostic/summary.json
