name: Mukshat 1.0 native Android checks
on:
  workflow_dispatch:
  push:
    branches: ['prototype/flutter-1.0']
    paths:
      - 'prototype/flutter-1.0/android/**'
      - 'prototype/flutter-1.0/lib/**'
      - 'prototype/flutter-1.0/assets/**'
      - 'prototype/flutter-1.0/pubspec.*'
      - 'prototype/flutter-1.0/native-resources/**'
      - 'prototype/flutter-1.0/scripts/prepare_native.py'
      - 'prototype/flutter-1.0/scripts/upstream/patch_country_scale.py'
      - 'prototype/flutter-1.0/test/**'
      - '.github/workflows/prototype-smoke.yml'
permissions:
  contents: read
concurrency:
  group: mukshat-prototype-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototype/flutter-1.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            prototype/flutter-1.0
            .github/workflows
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Prepare native test application
        env:
          ORG_GRADLE_PROJECT_prototypeAbis: x86_64
        run: |
          flutter config --no-analytics
          flutter pub get
          python3 scripts/prepare_native.py
          flutter build apk --debug --target-platform android-x64
          cd android
          ./gradlew :app:assembleDebugAndroidTest -Ptarget-platform=android-x64 -PprototypeAbis=x86_64 -Pflutter.androidSdkRoot="$ANDROID_SDK_ROOT" -Pflutter.installedNdkVersions=28.2.13676358
      - name: Enable KVM on temporary runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real engine offline and record while screen is locked
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: prototype/flutter-1.0
          script: |
            mkdir -p artifacts
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb install -r build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.mikshat.prototype android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.mikshat.prototype android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant com.mikshat.prototype android.permission.POST_NOTIFICATIONS
            adb shell appops set com.mikshat.prototype android:mock_location allow
            python3 scripts/run_android_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mukshat-1.0-native-test-evidence
          path: prototype/flutter-1.0/artifacts/
          if-no-files-found: warn
          retention-days: 14
