name: Mikshat targeted selected-place integration validation
'on':
  push:
    branches:
    - diagnostics/selection-fix-4615
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: mikshat-responsive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Responsive UIKit, search and GPS regressions (${{ matrix.device }})
    runs-on: xcode-27
    timeout-minutes: 70
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      MIKSHAT_TEST_DEVICE: ${{ matrix.device }}
    steps:
    - name: Check out responsive app sources
      uses: actions/checkout@v4
    - name: Record toolchain and available simulators
      shell: bash
      run: 'set -euo pipefail

        mkdir -p build/search-diagnostics

        xcodebuild -version | tee build/search-diagnostics/toolchain.txt

        printf ''MIKSHAT_XCODE_CACHE_ID=%s\n'' "$(xcodebuild -version | tr -cs ''[:alnum:]'' ''-'')" >> "$GITHUB_ENV"

        xcrun --sdk iphonesimulator --show-sdk-version | tee -a build/search-diagnostics/toolchain.txt

        uname -m | tee -a build/search-diagnostics/toolchain.txt

        xcrun simctl list --json runtimes > build/search-diagnostics/runtimes.json

        xcrun simctl list --json devicetypes > build/search-diagnostics/device-types.json

        '
    - name: Fetch pinned submodules
      shell: bash
      run: 'set -euo pipefail

        git submodule update --init --recursive --depth 1 --jobs 8

        '
    - name: Prepare app resources
      shell: bash
      run: 'set -euo pipefail

        python3 mikshat/prepare_branding.py

        python3 mikshat/prepare_satellite.py

        '
    - name: Ensure Metal compiler is available
      shell: bash
      run: "set -euo pipefail\nif ! xcrun metal -v >/dev/null 2>&1; then\n  xcodebuild -downloadComponent MetalToolchain\n  xcrun -k\nfi\nxcrun\
        \ metal -v\n"
    - name: Restore compiled objects for this Xcode toolchain
      id: derived-cache
      uses: actions/cache/restore@v4
      with:
        path: build/SearchDerivedData
        key: mikshat-search-derived-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MIKSHAT_XCODE_CACHE_ID }}-${{ github.sha }}-${{ github.run_id
          }}-${{ github.run_attempt }}-${{ matrix.device }}
        restore-keys: 'mikshat-search-derived-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MIKSHAT_XCODE_CACHE_ID }}-

          '
    - name: Restore unchanged build input timestamps
      shell: bash
      run: "set -euo pipefail\ncat > build/search-diagnostics/cache-input-mtimes.py <<'PY'\nfrom pathlib import Path\nimport hashlib\nimport json\n\
        import os\nimport sys\n\nmanifest = Path('build/SearchDerivedData/mikshat-input-mtimes.json')\nroots = ('iphone', 'libs', 'xcode', 'data',\
        \ '3party', 'private')\ndef inputs():\n    for root in roots:\n        if not Path(root).is_dir():\n            continue\n        for\
        \ directory, children, files in os.walk(root):\n            children[:] = [name for name in children if name not in ('.git', '__pycache__',\
        \ 'node_modules')]\n            yield Path(directory)\n            for name in files:\n                if name != '.git':\n          \
        \          yield Path(directory) / name\ndef digest(path):\n    if path.is_dir():\n        names = sorted(child.name for child in path.iterdir()\
        \ if child.name != '.git')\n        return hashlib.sha256('\\n'.join(names).encode()).hexdigest()\n    result = hashlib.sha256()\n   \
        \ with path.open('rb') as stream:\n        for block in iter(lambda: stream.read(1024 * 1024), b''):\n            result.update(block)\n\
        \    return result.hexdigest()\nif sys.argv[1] == 'restore':\n    restored = 0\n    if manifest.exists():\n        for item in json.loads(manifest.read_text()):\n\
        \            path = Path(item['path'])\n            if path.exists() and not path.is_symlink() and digest(path) == item['sha256']:\n \
        \               os.utime(path, ns=(path.stat().st_atime_ns, item['mtime_ns']))\n                restored += 1\n    print(f'Restored timestamps\
        \ for {restored} unchanged build inputs')\nelse:\n    entries = []\n    for path in inputs():\n        if path.exists() and not path.is_symlink():\n\
        \            entries.append(dict(path=str(path), sha256=digest(path), mtime_ns=path.stat().st_mtime_ns))\n    manifest.parent.mkdir(parents=True,\
        \ exist_ok=True)\n    manifest.write_text(json.dumps(entries))\n    print(f'Recorded {len(entries)} build input timestamps')\nPY\npython3\
        \ build/search-diagnostics/cache-input-mtimes.py restore\n"
    - name: Boot exact matching iOS runtime
      shell: bash
      run: "set -euo pipefail\ndefaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO\nmkdir -p build/arrow-geometry\nxcodebuild\
        \ -version | tee build/arrow-geometry/toolchain.txt\nxcrun simctl list --json runtimes > build/arrow-geometry/runtimes.json\npython3 -\
        \ <<'PYCODE'\nimport json,os,subprocess\nfrom pathlib import Path\ndef simctl(*args):\n    return subprocess.check_output(['xcrun','simctl',*args],text=True)\n\
        runtimes=json.loads(simctl('list','--json','runtimes'))['runtimes']\nmatching=[r for r in runtimes if r.get('isAvailable') and r.get('version')=='27.0'\
        \ and 'iOS' in r.get('identifier','')]\nif len(matching)!=1:raise SystemExit('Exactly iOS 27.0 is required; no silent runtime substitution')\n\
        runtime=matching[0]\ndevice=os.environ['MIKSHAT_TEST_DEVICE']\ntypes=json.loads(simctl('list','--json','devicetypes'))['devicetypes']\n\
        if device=='iPhone 16':\n    device_type=next(t for t in types if t['identifier']=='com.apple.CoreSimulator.SimDeviceType.iPhone-16')\n\
        else:\n    pads=[t for t in types if t['name'].startswith('iPad')]\n    preferred=[t for t in pads if 'Air 11' in t['name'] and 'M3' in\
        \ t['name']]\n    device_type=(preferred or pads)[-1]\nudid=simctl('create','Mikshat Responsive '+device+' iOS 27',device_type['identifier'],runtime['identifier']).strip()\n\
        simctl('boot',udid)\nsubprocess.run(['xcrun','simctl','bootstatus',udid,'-b'],check=True)\nselection={'udid':udid,'device':device_type,'runtime':runtime}\n\
        Path('build/arrow-geometry/simulator.json').write_text(json.dumps(selection,indent=2)+'\\n')\nwith open(os.environ['GITHUB_ENV'],'a')\
        \ as f:f.write('MIKSHAT_SIMULATOR_UDID='+udid+'\\n')\nprint(json.dumps(selection))\nPYCODE\n"
    - name: Run responsive UIKit, copy, navigation, search and GPS ownership tests
      id: search-tests
      timeout-minutes: 55
      shell: bash
      run: "set -euo pipefail\ntest_args=(\n  -workspace xcode/omim.xcworkspace -scheme OMaps -configuration Debug\n  -sdk iphonesimulator -destination\
        \ \"id=$MIKSHAT_SIMULATOR_UDID\"\n  -destination-timeout 120 -derivedDataPath build/SearchDerivedData\n  -testLanguage ar -testRegion\
        \ SA -parallel-testing-enabled NO\n  -maximum-concurrent-test-simulator-destinations 1 -test-timeouts-enabled YES\n  -default-test-execution-time-allowance\
        \ 120 -maximum-test-execution-time-allowance 180\n  -only-testing:OMapsTests/MikshatMapSceneLayoutTests\n  -only-testing:OMapsTests/MikshatMapControlLayoutTests\n\
        \  \"ARCHS=$(uname -m)\" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO\n)\nxcodebuild build-for-testing \"${test_args[@]}\"\
        \ -resultBundlePath build/SearchBuild.xcresult \\\n  2>&1 | tee build/search-diagnostics/xcodebuild-search-build.log\npython3 - <<'PYSETUP'\n\
        from pathlib import Path\nimport json, os, plistlib, subprocess\napps=[app for app in Path('build/SearchDerivedData/Build/Products/Debug-iphonesimulator').glob('*.app')\n\
        \      if plistlib.loads((app/'Info.plist').read_bytes()).get('CFBundleIdentifier')=='com.mikshat.maps.debug']\nif len(apps)!=1:raise\
        \ SystemExit(f'Expected one native test host, found {len(apps)}')\nbundle=plistlib.loads((apps[0]/'Info.plist').read_bytes())['CFBundleIdentifier']\n\
        udid=os.environ['MIKSHAT_SIMULATOR_UDID']\nsubprocess.run(['xcrun','simctl','install',udid,str(apps[0])],check=True)\nsubprocess.run(['xcrun','simctl','privacy',udid,'grant','location',bundle],check=True)\n\
        subprocess.run(['xcrun','simctl','location',udid,'set','24.7136,46.6753'],check=True)\nPath('build/search-diagnostics/synthetic-position.json').write_text(json.dumps({\n\
        \    'bundle':bundle,'coordinate':[24.7136,46.6753],\n    'source':'simctl synthetic test position; not a physical-device GPS reading',\n\
        \    'locationPermission':'granted in the isolated simulator only'},indent=2)+'\\n')\nPYSETUP\nif [[ \"$MIKSHAT_TEST_DEVICE\" == \"iPad\"\
        \ ]]; then\n  # iPadOS 27 windowed mode rejects scene orientation requests. Select\n  # the supported Full Screen Apps mode through Settings\
        \ on this fresh\n  # simulator; keep production windowing settings and all 47 tests intact.\n  xcodebuild test \\\n    -workspace xcode/omim.xcworkspace\
        \ -scheme MikshatSimulatorSetup -configuration Debug \\\n    -sdk iphonesimulator -destination \"id=$MIKSHAT_SIMULATOR_UDID\" \\\n   \
        \ -derivedDataPath build/SearchDerivedData -resultBundlePath build/SimulatorSetup.xcresult \\\n    -testLanguage en -testRegion US -parallel-testing-enabled\
        \ NO \\\n    -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \\\n    -only-testing:MikshatSimulatorSetupUITests/SimulatorWindowingSetupTests/testSelectFullScreenAppsOnTheIsolatedIPad\
        \ \\\n    \"ARCHS=$(uname -m)\" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \\\n    2>&1 | tee build/search-diagnostics/xcodebuild-simulator-setup.log\n\
        \  python3 - <<'PYWINDOWING'\nfrom pathlib import Path\nimport importlib.util,json\nspec=importlib.util.spec_from_file_location('native_results','mikshat/tests/weather-data/verify-native-results.py')\n\
        m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)\nm.EXPECTED_CLASSES={'SimulatorWindowingSetupTests':1}\np=Path('build/search-diagnostics/xcodebuild-simulator-setup.log')\n\
        report=m.analyze(p.read_text(errors='replace'))\nreport['scope']='Public XCUITest Settings setup on an isolated iPad simulator; native\
        \ scene geometry is verified separately'\np.with_suffix('.summary.json').write_text(json.dumps(report,indent=2)+'\\n')\nprint(json.dumps(report))\n\
        if not report['passed']:raise SystemExit('The iPad Settings setup must execute once and pass without skips')\nPYWINDOWING\nfi\nxcodebuild\
        \ test-without-building \"${test_args[@]}\" -resultBundlePath build/SearchRegressions.xcresult \\\n  2>&1 | tee build/search-diagnostics/xcodebuild-search-tests.log\n"
    - name: Require real native test execution
      if: always()
      run: 'python3 - <<''PYCODE''

        from pathlib import Path

        import importlib.util,json

        spec=importlib.util.spec_from_file_location(''native_results'',''mikshat/tests/weather-data/verify-native-results.py'')

        m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)

        m.EXPECTED_CLASSES={''MikshatMapSceneLayoutTests'':3,''MikshatMapControlLayoutTests'':1}

        p=Path(''build/search-diagnostics/xcodebuild-search-tests.log'')

        report=m.analyze(p.read_text(errors=''replace'') if p.exists() else '''')

        p.with_suffix(''.summary.json'').write_text(json.dumps(report,indent=2)+''\n'')

        print(json.dumps(report))

        if not report[''passed'']:raise SystemExit(''All 4 targeted native tests must execute once and pass without skips or cancellation'')

        PYCODE

        '
    - name: Collect app crash reports and simulator log
      if: always()
      shell: bash
      run: "mkdir -p build/search-diagnostics/crash-reports\npython3 - <<'PY'\nfrom pathlib import Path\nimport shutil\nsource = Path.home() /\
        \ 'Library/Logs/DiagnosticReports'\ndestination = Path('build/search-diagnostics/crash-reports')\nif source.exists():\n    for report\
        \ in source.rglob('*'):\n        if report.is_file() and report.suffix in ('.ips', '.crash', '.hang'):\n            if any(name in report.name.lower()\
        \ for name in ('organic', 'omaps')):\n                shutil.copy2(report, destination / report.name)\nPY\nif [[ -n \"${MIKSHAT_SIMULATOR_UDID:-}\"\
        \ ]]; then\n  xcrun simctl spawn \"$MIKSHAT_SIMULATOR_UDID\" log show --last 3m --style compact \\\n    --predicate 'process CONTAINS[c]\
        \ \"Organic\" OR process CONTAINS[c] \"OMaps\"' \\\n    > build/search-diagnostics/simulator-app.log 2>&1 || true\nfi\n"
    - name: Export actual UIKit screenshot attachments
      if: always()
      shell: bash
      run: "set -euo pipefail\nif [[ -d build/SearchRegressions.xcresult ]]; then\n  xcrun xcresulttool export attachments --path build/SearchRegressions.xcresult\
        \ --output-path build/responsive-screenshots\nfi\nif [[ -d build/SimulatorSetup.xcresult ]]; then\n  xcrun xcresulttool export attachments\
        \ --path build/SimulatorSetup.xcresult --output-path build/simulator-setup-screenshots\nfi\n"
    - name: Prepare small previews for visual review
      if: always()
      shell: bash
      run: "python3 - <<'PYCODE'\nfrom pathlib import Path\nimport base64,json,os,subprocess\nudid=os.environ.get('MIKSHAT_SIMULATOR_UDID')\n\
        if not udid:raise SystemExit(0)\ncontainer=subprocess.run(['xcrun','simctl','get_app_container',udid,'com.mikshat.maps.debug','data'],text=True,capture_output=True)\n\
        if container.returncode:raise SystemExit(0)\nsource=Path(container.stdout.strip())/'Documents'\ntarget=Path('build/responsive-screenshots/previews');target.mkdir(parents=True,exist_ok=True)\n\
        files=sorted([*source.glob('responsive-*-fixture.png'),*source.glob('responsive-real-scene-*.png'),*source.glob('weather-*-fixture.png')])\n\
        print('MIKSHAT_UI_IMAGES '+json.dumps([p.name for p in files]))\npreferred=['real-scene-selected-point-initial-4','real-scene-selected-point-initial-1',\n\
        \           'real-scene-prestart','real-scene-native-trip','real-scene-direct-trip',\n           'real-scene-home','real-scene-save-share','real-scene-search-keyboard',\n\
        \           'real-scene-weather-sheet','weather-compact-phone-portrait-fixture']\nselected=[]\nfor token in preferred:\n    matches=[p\
        \ for p in files if token in p.name]\n    if matches:selected.append(matches[0])\nfor image in selected:\n    preview=target/image.name\n\
        \    subprocess.run(['sips','-Z','700',str(image),'--out',str(preview)],check=True,stdout=subprocess.DEVNULL)\n    data=preview.read_bytes()\n\
        \    if len(data)<=300000:\n        print('MIKSHAT_UI_PREVIEW '+json.dumps({'name':preview.name,'pngBase64':base64.b64encode(data).decode()}))\n\
        PYCODE\n"
    - name: Upload native test results, layout screenshots and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mikshat-responsive-${{ matrix.device }}-ios27
        retention-days: 7
        if-no-files-found: warn
        path: 'build/search-diagnostics/

          build/weather-screenshots/

          build/SearchRegressions.xcresult/

          build/SearchBuild.xcresult/

          build/SimulatorSetup.xcresult/

          build/simulator-setup-screenshots/

          build/responsive-screenshots/'
    - name: Record current source timestamps for the next incremental build
      if: always()
      shell: bash
      run: "if [[ -f build/search-diagnostics/cache-input-mtimes.py && -d build/SearchDerivedData/Build ]]; then\n  python3 build/search-diagnostics/cache-input-mtimes.py\
        \ record\nfi\n"
    - name: Save compiled objects even when a test or test compilation fails
      if: always() && hashFiles('build/SearchDerivedData/mikshat-input-mtimes.json') != ''
      timeout-minutes: 4
      uses: actions/cache/save@v4
      with:
        path: build/SearchDerivedData
        key: mikshat-search-derived-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MIKSHAT_XCODE_CACHE_ID }}-${{ github.sha }}-${{ github.run_id
          }}-${{ github.run_attempt }}-${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        device:
        - iPhone 16
