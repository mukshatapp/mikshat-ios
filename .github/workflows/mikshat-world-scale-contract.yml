name: Mikshat World geometry scale contract
'on':
  push:
    branches:
    - feature/ios-layout-followup
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: mikshat-world-scale-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry-contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    env:
      CC: gcc-15
      CXX: g++-15
      QT_QPA_PLATFORM: offscreen
    steps:
    - name: Check out candidate and its unchanged baseline
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Fetch pinned dependencies
      run: git submodule update --init --recursive --depth 1 --jobs 8
    - name: Install bounded native-test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build ccache gcc-15 g++-15 qt6-base-dev libharfbuzz-dev libfreetype-dev libgl1-mesa-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev
    - name: Restore existing compiler cache without duplicating app caches
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: CMake-ubuntu-26.04-gcc-15--Debug
        max-size: 1G
        save: false
    - name: Verify the real World fixture fails before and passes after the query correction
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/world-scale-diagnostics build/world-scale/test-writable
        sha256sum data/World.mwm data/WorldCoasts.mwm data/minsk-pass.mwm | tee build/world-scale-diagnostics/fixtures.sha256
        cp libs/indexer/data_source.cpp build/world-scale-diagnostics/fixed-data-source.cpp
        trap 'cp build/world-scale-diagnostics/fixed-data-source.cpp libs/indexer/data_source.cpp' EXIT
        git show HEAD^:libs/indexer/data_source.cpp > libs/indexer/data_source.cpp
        python3 - <<'PYBASELINE'
        from pathlib import Path
        baseline=Path('libs/indexer/data_source.cpp').read_text()
        fixed=Path('build/world-scale-diagnostics/fixed-data-source.cpp').read_text()
        if 'scale += 4' not in baseline or 'scale += 4' in fixed:
            raise SystemExit('The before/after proof requires the unsafe baseline and the corrected candidate')
        PYBASELINE
        cmake -S . -B build/world-scale -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSKIP_QT_GUI=ON -DBUILD_TESTING=ON -DBUILD_DEV_SANDBOX=OFF -DBUILD_OPENGL_TESTS=OFF -DCMAKE_UNITY_BUILD=ON -DCMAKE_C_FLAGS=-g1 -DCMAKE_CXX_FLAGS=-g1 -DUSE_CCACHE=ON \
          2>&1 | tee build/world-scale-diagnostics/configure.log
        cmake --build build/world-scale --target mwm_tests --parallel 3 \
          2>&1 | tee build/world-scale-diagnostics/before-build.log
        test_args=(--data_path="$PWD/data" --user_resource_path="$PWD/data" --writable_path="$PWD/build/world-scale/test-writable")
        set +e
        build/world-scale/mwm_tests --filter=ForEachFeatureID_WorldGeometryScaleContract "${test_args[@]}" \
          2>&1 | tee build/world-scale-diagnostics/before-test.log
        before_status=${PIPESTATUS[0]}
        set -e
        echo "$before_status" > build/world-scale-diagnostics/before-exit.txt
        cp build/world-scale-diagnostics/fixed-data-source.cpp libs/indexer/data_source.cpp
        cmake --build build/world-scale --target mwm_tests --parallel 3 \
          2>&1 | tee build/world-scale-diagnostics/after-build.log
        build/world-scale/mwm_tests --filter=ForEachFeatureID_WorldGeometryScaleContract "${test_args[@]}" \
          2>&1 | tee build/world-scale-diagnostics/after-test.log
        build/world-scale/mwm_tests --filter=ForEachFeatureID_Test "${test_args[@]}" \
          2>&1 | tee build/world-scale-diagnostics/existing-regression.log
        python3 - <<'PYPROOF'
        from pathlib import Path
        import json,re
        root=Path('build/world-scale-diagnostics')
        def records(name):
            content=(root/name).read_text(errors='replace')
            result=[]
            for line in content.splitlines():
                marker='MIKSHAT_WORLD_GEOMETRY '
                if marker in line:
                    value,_=json.JSONDecoder().raw_decode(line.split(marker,1)[1])
                    result.append(value)
            scales=[r for r in result if r.get('event')=='scale']
            features=[r for r in result if r.get('event')=='reported-feature']
            summary=[r for r in result if r.get('event')=='summary']
            if len(scales)!=10 or sorted(r['scale'] for r in scales)!=list(range(10)) or len(features)!=20 or len(summary)!=1:
                raise SystemExit('Every real World zoom and both reported feature IDs must be inspected; missing setup is not proof')
            if len(re.findall(r'Running[^\n]*ForEachFeatureID_WorldGeometryScaleContract',content))!=1:
                raise SystemExit('The focused native contract must actually execute once')
            last=[r for r in features if r['scale']==9]
            if len(last)!=2 or not all(r['returned'] and not r['emptyGeometry'] for r in last):
                raise SystemExit('Both real reported features must still be returned with valid geometry at World zoom 9')
            return content,features,summary[0]
        before_text,before_features,before=records('before-test.log')
        after_text,after_features,after=records('after-test.log')
        if int((root/'before-exit.txt').read_text())!=1 or before['emptyGeometry']<=0:
            raise SystemExit('The uncorrected source must fail specifically on returned geometry, not compilation or absent fixtures')
        if not any(r['returned'] and r['emptyGeometry'] for r in before_features):
            raise SystemExit('The reported World features must reproduce the invalid lower-zoom geometry query')
        if after['emptyGeometry']!=0 or after['returned']<=0 or 'All tests passed.' not in after_text:
            raise SystemExit('The corrected source must return real features without requesting missing geometry')
        existing=(root/'existing-regression.log').read_text(errors='replace')
        if len(re.findall(r'Running[^\n]*ForEachFeatureID_Test',existing))!=1 or '[OK]' not in existing or 'All tests passed.' not in existing:
            raise SystemExit('The existing World/WorldCoasts/minsk-pass regression must execute and pass')
        report={'before':before,'after':after,'reportedMissingBefore':[r for r in before_features if r['returned'] and r['emptyGeometry']],
                'existingRegressionPassed':True,'scope':'Real bundled World geometry and native data-source queries; all runtime assertions remain enabled'}
        (root/'proof.json').write_text(json.dumps(report,indent=2)+'\n')
        print('MIKSHAT_WORLD_GEOMETRY_PROOF '+json.dumps(report))
        PYPROOF
    - name: Retain complete geometry-contract proof
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mikshat-world-scale-contract
        path: build/world-scale-diagnostics/
        retention-days: 7
