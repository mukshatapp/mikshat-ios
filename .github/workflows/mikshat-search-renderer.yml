name: Mikshat rendered Arabic search regression
'on':
  push:
    branches:
    - diagnostics/search-full-app
    - feature/ios-layout-followup
    - diagnostics/selection-fix-4615
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: mikshat-search-renderer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rendered-search:
    name: Normal Metal renderer and Arabic on iPhone 16 / iOS 26
    if: github.ref == 'refs/heads/feature/ios-layout-followup' || contains(github.event.head_commit.message, '[renderer-only]') || github.event_name
      == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
    - name: Check out the diagnostic revision
      uses: actions/checkout@v4
    - name: Record toolchain and available simulators
      shell: bash
      run: 'set -euo pipefail

        mkdir -p build/search-diagnostics

        xcodebuild -version | tee build/search-diagnostics/toolchain.txt

        printf ''MIKSHAT_XCODE_CACHE_ID=%s\n'' "$(xcodebuild -version | tr -cs ''[:alnum:]'' ''-'')" >> "$GITHUB_ENV"

        xcrun --sdk iphonesimulator --show-sdk-version | tee -a build/search-diagnostics/toolchain.txt

        uname -m | tee -a build/search-diagnostics/toolchain.txt

        xcrun simctl list --json runtimes > build/search-diagnostics/runtimes.json

        xcrun simctl list --json devicetypes > build/search-diagnostics/device-types.json

        '
    - name: Fetch pinned submodules
      shell: bash
      run: 'set -euo pipefail

        git submodule update --init --recursive --depth 1 --jobs 8

        '
    - name: Prepare app resources
      shell: bash
      run: 'set -euo pipefail

        python3 mikshat/prepare_branding.py

        python3 mikshat/prepare_satellite.py

        '
    - name: Ensure Metal compiler is available
      shell: bash
      run: "set -euo pipefail\nif ! xcrun metal -v >/dev/null 2>&1; then\n  xcodebuild -downloadComponent MetalToolchain\n  xcrun -k\nfi\nxcrun\
        \ metal -v\n"
    - name: Restore compiled objects for this Xcode toolchain
      id: derived-cache
      uses: actions/cache/restore@v4
      with:
        path: build/SearchDerivedData
        key: mikshat-search-derived-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MIKSHAT_XCODE_CACHE_ID }}-${{ github.sha }}-${{ github.run_id
          }}-${{ github.run_attempt }}
        restore-keys: 'mikshat-search-derived-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MIKSHAT_XCODE_CACHE_ID }}-

          '
    - name: Restore unchanged build input timestamps
      shell: bash
      run: "set -euo pipefail\ncat > build/search-diagnostics/cache-input-mtimes.py <<'PY'\nfrom pathlib import Path\nimport hashlib\nimport json\n\
        import os\nimport sys\n\nmanifest = Path('build/SearchDerivedData/mikshat-input-mtimes.json')\nroots = ('iphone', 'libs', 'xcode', 'data',\
        \ '3party', 'private')\ndef inputs():\n    for root in roots:\n        if not Path(root).is_dir():\n            continue\n        for\
        \ directory, children, files in os.walk(root):\n            children[:] = [name for name in children if name not in ('.git', '__pycache__',\
        \ 'node_modules')]\n            yield Path(directory)\n            for name in files:\n                if name != '.git':\n          \
        \          yield Path(directory) / name\ndef digest(path):\n    if path.is_dir():\n        names = sorted(child.name for child in path.iterdir()\
        \ if child.name != '.git')\n        return hashlib.sha256('\\n'.join(names).encode()).hexdigest()\n    result = hashlib.sha256()\n   \
        \ with path.open('rb') as stream:\n        for block in iter(lambda: stream.read(1024 * 1024), b''):\n            result.update(block)\n\
        \    return result.hexdigest()\nif sys.argv[1] == 'restore':\n    restored = 0\n    if manifest.exists():\n        for item in json.loads(manifest.read_text()):\n\
        \            path = Path(item['path'])\n            if path.exists() and not path.is_symlink() and digest(path) == item['sha256']:\n \
        \               os.utime(path, ns=(path.stat().st_atime_ns, item['mtime_ns']))\n                restored += 1\n    print(f'Restored timestamps\
        \ for {restored} unchanged build inputs')\nelse:\n    entries = []\n    for path in inputs():\n        if path.exists() and not path.is_symlink():\n\
        \            entries.append(dict(path=str(path), sha256=digest(path), mtime_ns=path.stat().st_mtime_ns))\n    manifest.parent.mkdir(parents=True,\
        \ exist_ok=True)\n    manifest.write_text(json.dumps(entries))\n    print(f'Recorded {len(entries)} build input timestamps')\nPY\npython3\
        \ build/search-diagnostics/cache-input-mtimes.py restore\n"
    - name: Select and boot iPhone 16 with iOS 26
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\n\ndef simctl(*arguments):\n\
        \    return subprocess.run(['xcrun', 'simctl', *arguments], check=True, capture_output=True, text=True).stdout\n\nruntimes = json.loads(simctl('list',\
        \ '--json', 'runtimes'))['runtimes']\ncandidates = [runtime for runtime in runtimes\n              if runtime.get('isAvailable')\n   \
        \           and runtime.get('identifier', '').startswith('com.apple.CoreSimulator.SimRuntime.iOS-26-')]\nif not candidates:\n    raise\
        \ SystemExit('No available iOS 26 runtime. See build/search-diagnostics/runtimes.json; do not substitute another iOS version silently.')\n\
        runtime = max(candidates, key=lambda value: tuple(int(part) for part in value['version'].split('.')))\ndevice_type = 'com.apple.CoreSimulator.SimDeviceType.iPhone-16'\n\
        device_types = json.loads(simctl('list', '--json', 'devicetypes'))['devicetypes']\nif not any(value['identifier'] == device_type for value\
        \ in device_types):\n    raise SystemExit('This Xcode installation has no iPhone 16 simulator device type.')\ndevices = json.loads(simctl('list',\
        \ '--json', 'devices', 'available'))['devices']\nmatching = [device for device in devices.get(runtime['identifier'], [])\n           \
        \ if device.get('deviceTypeIdentifier') == device_type]\nif matching:\n    device = matching[0]\n    udid = device['udid']\n    if device['state']\
        \ != 'Booted':\n        simctl('boot', udid)\nelse:\n    udid = simctl('create', 'Mikshat Search iPhone 16', device_type, runtime['identifier']).strip()\n\
        \    simctl('boot', udid)\nsubprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True)\nselection = dict(device='iPhone\
        \ 16', udid=udid, runtime=runtime['identifier'], version=runtime['version'])\nPath('build/search-diagnostics/simulator-selection.json').write_text(json.dumps(selection,\
        \ indent=2) + '\\n')\nwith open(os.environ['GITHUB_ENV'], 'a') as stream:\n    stream.write(f'MIKSHAT_SIMULATOR_UDID={udid}\\n')\nprint(json.dumps(selection))\n\
        PY\n"
    - name: Compile actual app and test bundle without launching the test host
      id: renderer-build
      timeout-minutes: 30
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYCODE'\nfrom pathlib import Path\nsource = Path('iphone/Maps/Tests/UI/SearchOnMapTests/SearchOnMapViewTests.swift').read_text()\n\
        if source.count('try await requireRenderedArabicMapIfRequested(map)') < 2 or 'renderer-ready=true' not in source:\n    raise SystemExit('Renderer/Arabic\
        \ precondition helper is not installed in both selected tests; refusing a false coverage run.')\nPYCODE\nxcodebuild build-for-testing\
        \ \\\n  -workspace xcode/omim.xcworkspace \\\n  -scheme OMaps \\\n  -configuration Debug \\\n  -sdk iphonesimulator \\\n  -destination\
        \ \"id=$MIKSHAT_SIMULATOR_UDID\" \\\n  -destination-timeout 120 \\\n  -derivedDataPath build/SearchDerivedData \\\n  -resultBundlePath\
        \ build/RendererBuild.xcresult \\\n  ARCHS=\"$(uname -m)\" \\\n  ONLY_ACTIVE_ARCH=YES \\\n  CODE_SIGNING_REQUIRED=NO \\\n  CODE_SIGNING_ALLOWED=NO\
        \ \\\n  2>&1 | tee build/search-diagnostics/xcodebuild-renderer-build.log\n"
    - name: Locate the original native test plan
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYCODE'\nfrom pathlib import Path\nimport os,plistlib\nproducts=Path('build/SearchDerivedData/Build/Products').resolve()\n\
        plans=[p for p in products.glob('*.xctestrun') if p.name!='MikshatRendererArabic.xctestrun']\nif not plans:\n    raise SystemExit('build-for-testing\
        \ did not produce an original xctestrun file')\noriginal=max(plans,key=lambda path:path.stat().st_mtime_ns)\nwith original.open('rb')\
        \ as stream:plan=plistlib.load(stream)\narguments=[]\ndef inspect(value):\n    if isinstance(value,dict):\n        if value.get('BlueprintName')=='OMapsTests'\
        \ or str(value.get('TestBundlePath','')).endswith('/OMapsTests.xctest'):\n            arguments.append(value.get('CommandLineArguments',[]))\n\
        \        for child in value.values():inspect(child)\n    elif isinstance(value,list):\n        for child in value:inspect(child)\ninspect(plan)\n\
        if not arguments or any('-IsTests' not in args or '-MikshatRequireRenderer' in args for args in arguments):\n    raise SystemExit('The\
        \ original OMapsTests plan must retain -IsTests and exclude renderer diagnostics')\nwith open(os.environ['GITHUB_ENV'],'a') as stream:\n\
        \    stream.write(f'MIKSHAT_NATIVE_XCTESTRUN={original}\\n')\nprint(f'Native candidate test plan: {original}; -IsTests retained')\nPYCODE\n"
    - name: Recheck all 17 native search regressions with candidate production code
      id: native-tests
      timeout-minutes: 8
      shell: bash
      run: "set -euo pipefail\nxcodebuild test-without-building \\\n  -xctestrun \"$MIKSHAT_NATIVE_XCTESTRUN\" \\\n  -destination \"id=$MIKSHAT_SIMULATOR_UDID\"\
        \ \\\n  -destination-timeout 120 \\\n  -resultBundlePath build/NativeSearchRecheck.xcresult \\\n  -parallel-testing-enabled NO \\\n  -maximum-concurrent-test-simulator-destinations\
        \ 1 \\\n  -test-timeouts-enabled YES \\\n  -default-test-execution-time-allowance 120 \\\n  -maximum-test-execution-time-allowance 180\
        \ \\\n  -only-testing:OMapsTests/SearchThemeWindowLifecycleTests \\\n  -only-testing:OMapsTests/SearchOnMapManagerTests \\\n  -only-testing:OMapsTests/SearchOnMapHeaderViewTests\
        \ \\\n  -only-testing:OMapsTests/SearchTabLayoutRegressionTests \\\n  CODE_SIGNING_REQUIRED=NO \\\n  CODE_SIGNING_ALLOWED=NO \\\n  2>&1\
        \ | tee build/search-diagnostics/xcodebuild-native-search-recheck.log\n"
    - name: Verify the native regression suite really executed and passed
      if: always() && steps.native-tests.outcome != 'skipped'
      shell: bash
      env:
        MIKSHAT_NATIVE_OUTCOME: ${{ steps.native-tests.outcome }}
      run: "python3 - <<'PYCODE'\nfrom pathlib import Path\nimport json,os,re\npath=Path('build/search-diagnostics/xcodebuild-native-search-recheck.log')\n\
        text=path.read_text(errors='replace') if path.exists() else ''\nstarted=re.findall(r'Test Case (.*?) started',text)\ncounts=[dict(tests=int(tests),failures=int(failures))\n\
        \        for tests,failures in re.findall(r'Executed (\\d+) tests?, with (\\d+) failures?',text)]\ntest_failures=[line for line in text.splitlines()\
        \ if re.search(r'Test Case .* failed|:\\d+: error: -\\[',line)]\npassed=os.environ.get('MIKSHAT_NATIVE_OUTCOME')=='success' and len(started)>=17\
        \ and any(row['tests']>=17 and row['failures']==0 for row in counts) and not test_failures\nreport=dict(status='test_execution' if started\
        \ else 'no_test_execution_recorded',testCasesStarted=len(started),\n            executionSummaries=counts,testFailures=test_failures[-30:],allNativeRegressionsPassed=passed,\n\
        \            requirement='All 17 or more native search regressions must execute successfully before renderer coverage')\nPath('build/search-diagnostics/native-search-recheck-summary.json').write_text(json.dumps(report,indent=2)+'\\\
        n')\nif os.environ.get('GITHUB_STEP_SUMMARY'):\n    with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:\n        stream.write(f\"\
        ### Native candidate search recheck\\n\\nStarted: {len(started)}; all native regressions passed: {passed}.\\n\\nExecution summaries: {counts}\\\
        n\\n\")\nprint(json.dumps(report))\nif not passed:\n    raise SystemExit('Native regression validation did not pass. Do not claim the\
        \ known layout failures are fixed.')\nPYCODE\n"
    - name: Configure normal renderer and Arabic launch arguments
      id: renderer-config
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYCODE'\nfrom pathlib import Path\nimport json,math,os,plistlib,subprocess\nproducts=Path('build/SearchDerivedData/Build/Products').resolve()\n\
        plans=[p for p in products.glob('*.xctestrun') if p.name!='MikshatRendererArabic.xctestrun']\nif not plans:\n    raise SystemExit('build-for-testing\
        \ did not produce an xctestrun file')\noriginal=Path(os.environ['MIKSHAT_NATIVE_XCTESTRUN'])\nwith original.open('rb') as stream:\n  \
        \  plan=plistlib.load(stream)\npatched=[]\nextra=['-MikshatRequireRenderer','-AppleLanguages','(ar)','-AppleLocale','ar_SA',\n       '-AlohalyticsInstallationId','I:MikshatRendererDiagnostics']\n\
        def patch(value):\n    if isinstance(value,dict):\n        if value.get('BlueprintName')=='OMapsTests' or str(value.get('TestBundlePath','')).endswith('/OMapsTests.xctest'):\n\
        \            args=value.get('CommandLineArguments',[])\n            if not isinstance(args,list) or not all(isinstance(item,str) for item\
        \ in args):\n                raise SystemExit('Unexpected xctestrun argument format')\n            filtered=[]\n            skip=False\n\
        \            for arg in args:\n                if skip:\n                    skip=False\n                    continue\n              \
        \  if arg in ('-AppleLanguages','-AppleLocale','-AlohalyticsInstallationId'):\n                    skip=True\n                elif arg\
        \ not in ('-IsTests','-MikshatRequireRenderer'):\n                    filtered.append(arg)\n            value['CommandLineArguments']=filtered+extra\n\
        \            patched.append(dict(target=value.get('BlueprintName','OMapsTests'),arguments=value['CommandLineArguments']))\n        for\
        \ child in value.values():patch(child)\n    elif isinstance(value,list):\n        for child in value:patch(child)\npatch(plan)\nif not\
        \ patched:\n    raise SystemExit('No OMapsTests target found in generated xctestrun')\n# __TESTROOT__ paths remain valid because this\
        \ copy stays beside the original.\ntarget=products/'MikshatRendererArabic.xctestrun'\nwith target.open('wb') as stream:plistlib.dump(plan,stream)\n\
        apps=[]\nfor path in (products/'Debug-iphonesimulator').glob('*.app'):\n    with (path/'Info.plist').open('rb') as stream:info=plistlib.load(stream)\n\
        \    if info.get('CFBundleIdentifier')=='com.mikshat.maps.debug':apps.append(path)\nif len(apps)!=1:\n    raise SystemExit(f'Expected\
        \ one Debug app, found {len(apps)}')\napp=apps[0]\nudid=os.environ['MIKSHAT_SIMULATOR_UDID']\nbundle='com.mikshat.maps.debug'\nprevious=subprocess.run(['xcrun','simctl','get_app_container',udid,bundle,'data'],capture_output=True,text=True)\n\
        old_container=previous.stdout.strip() if previous.returncode==0 else None\n# Native regression fixtures persist screen geometry/settings.\
        \ Give\n# normal rendering a fresh sandbox while reusing the same built app.\nprint(json.dumps(dict(event='renderer-isolation-start',bundleIdentifier=bundle,oldContainer=old_container)))\n\
        subprocess.run(['xcrun','simctl','uninstall',udid,bundle],check=True)\nsubprocess.run(['xcrun','simctl','install',udid,str(app)],check=True)\n\
        container=subprocess.run(['xcrun','simctl','get_app_container',udid,bundle,'data'],check=True,capture_output=True,text=True).stdout.strip()\n\
        isolation=dict(bundleIdentifier=bundle,oldContainer=old_container,newContainer=container,\n               reason='Uninstall/reinstall\
        \ only the diagnostic Debug app to discard native-test persisted screen geometry and settings before normal rendering; compiled app and\
        \ test products are reused unchanged.')\n# AnyRectD serializes global centre x/y, angle, then local min/max x/y.\n# Keep this search profile\
        \ near synthetic GPS instead of World overview.\nlatitude,longitude=24.7136,46.6753\nmercator_y=math.degrees(math.log(math.tan(math.pi/4+math.radians(latitude)/2)))\n\
        viewport_values=(longitude,mercator_y,0,-0.1,-0.2,0.1,0.2)\nif not all(math.isfinite(value) for value in viewport_values):\n    raise\
        \ SystemExit('Controlled search viewport must contain seven finite values')\nif not (-180<longitude-0.1<longitude+0.1<180 and -180<mercator_y-0.2<mercator_y+0.2<180):\n\
        \    raise SystemExit('Controlled search viewport must fit inside the Mercator world')\nviewport_text=' '.join(format(value,'.12g') for\
        \ value in viewport_values)\nsettings_path=Path(container)/'Documents/settings.ini'\nsettings_path.parent.mkdir(parents=True,exist_ok=True)\n\
        settings_lines=settings_path.read_text().splitlines() if settings_path.exists() else []\nsettings_lines=[line for line in settings_lines\
        \ if not line.startswith('ScreenClipRect=')]\nsettings_lines.append('ScreenClipRect='+viewport_text)\nsettings_path.write_text('\\n'.join(settings_lines)+'\\\
        n')\nviewport=dict(settingsPath=str(settings_path),key='ScreenClipRect',text=viewport_text,\n              syntheticGps=[latitude,longitude],serialization='AnyRectD:\
        \ centreX centreY angle localMinX localMinY localMaxX localMaxY',\n              reason='Controlled valid local search viewport around\
        \ synthetic Riyadh GPS; excludes World overview assertion coverage. Production assertions remain enabled.')\n(Path(container)/'Documents/mikshat-renderer-coverage.jsonl').unlink(missing_ok=True)\n\
        privacy=[]\nfor service in ('location','location-always'):\n    result=subprocess.run(['xcrun','simctl','privacy',udid,'grant',service,'com.mikshat.maps.debug'],capture_output=True,text=True)\n\
        \    privacy.append(dict(service=service,returncode=result.returncode,output=result.stdout+result.stderr))\nlocation=subprocess.run(['xcrun','simctl','location',udid,'set','24.7136,46.6753'],capture_output=True,text=True)\n\
        synthetic=dict(source='simctl fixed location; not a user GPS reading',coordinate='24.7136,46.6753',returncode=location.returncode,output=location.stdout+location.stderr)\n\
        Path('build/search-diagnostics/renderer-launch.json').write_text(json.dumps(dict(original=str(original),patched=str(target),targets=patched,privacy=privacy,syntheticLocation=synthetic,containerIsolation=isolation,controlledViewport=viewport,\n\
        \    firstSession='Seeded installation ID via launch arguments to match an existing app user'),indent=2)+'\\n')\nwith open(os.environ['GITHUB_ENV'],'a')\
        \ as stream:\n    stream.write(f'MIKSHAT_RENDERER_XCTESTRUN={target}\\n')\n    stream.write('MIKSHAT_RENDERER_APP_ID=com.mikshat.maps.debug\\\
        n')\nprint(json.dumps(dict(targets=patched,containerIsolation=isolation,controlledViewport=viewport)))\nPYCODE\n"
    - name: Run only the normal-renderer Arabic search cases
      id: renderer-tests
      timeout-minutes: 8
      shell: bash
      run: "set -euo pipefail\n# Alternate this test simulator's synthetic position by about 11 metres\n# to pass native 2\u20135 metre distance\
        \ filters. Both points stay within the\n# helper's 100 metre radius; no user GPS reading or heading is asserted.\npython3 -u - \"$MIKSHAT_SIMULATOR_UDID\"\
        \ > build/search-diagnostics/synthetic-location-refresh.jsonl 2>&1 <<'PYCODE' &\nimport datetime,json,subprocess,sys,time\nudid=sys.argv[1]\n\
        deadline=time.monotonic()+480\niteration=0\nwhile time.monotonic()<deadline:\n    latitude=24.7136 if iteration%2==0 else 24.7137\n  \
        \  coordinate=f'{latitude:.4f},46.6753'\n    attempt=dict(timestamp=datetime.datetime.now(datetime.timezone.utc).isoformat(),\n      \
        \           source='simctl alternating synthetic locations; not user GPS readings',\n                 coordinate=coordinate,latitude=latitude,longitude=46.6753)\n\
        \    try:\n        result=subprocess.run(['xcrun','simctl','location',udid,'set',coordinate],\n                              capture_output=True,text=True,timeout=10)\n\
        \        attempt.update(returncode=result.returncode,output=result.stdout+result.stderr)\n    except subprocess.TimeoutExpired:\n    \
        \    attempt.update(returncode=None,error='simctl location timed out after 10 seconds')\n    print(json.dumps(attempt),flush=True)\n \
        \   iteration+=1\n    time.sleep(min(3,max(0,deadline-time.monotonic())))\nPYCODE\nlocation_refresh_pid=$!\ncleanup_location_refresh()\
        \ {\n  kill \"$location_refresh_pid\" 2>/dev/null || true\n  wait \"$location_refresh_pid\" 2>/dev/null || true\n}\ntrap cleanup_location_refresh\
        \ EXIT\ntrap 'exit 130' INT\ntrap 'exit 143' TERM\nxcodebuild test-without-building \\\n  -xctestrun \"$MIKSHAT_RENDERER_XCTESTRUN\" \\\
        \n  -destination \"id=$MIKSHAT_SIMULATOR_UDID\" \\\n  -destination-timeout 120 \\\n  -resultBundlePath build/RendererArabicSearch.xcresult\
        \ \\\n  -parallel-testing-enabled NO \\\n  -maximum-concurrent-test-simulator-destinations 1 \\\n  -test-timeouts-enabled YES \\\n  -default-test-execution-time-allowance\
        \ 120 \\\n  -maximum-test-execution-time-allowance 180 \\\n  -only-testing:OMapsTests/SearchThemeWindowLifecycleTests/test_SearchOpensFocusesAndClosesRepeatedlyInNormalAndRoutingModes\
        \ \\\n  -only-testing:OMapsTests/SearchThemeWindowLifecycleTests/test_GlobalSearchManagerOpensWithDashboardObserversInPrepareAndNavigation\
        \ \\\n  -only-testing:OMapsTests/SearchOnMapHeaderViewTests/test_CoordinateInputLaysOutBothRowsWithPositiveNonoverlappingFieldWidths \\\
        \n  CODE_SIGNING_REQUIRED=NO \\\n  CODE_SIGNING_ALLOWED=NO \\\n  2>&1 | tee build/search-diagnostics/xcodebuild-renderer-arabic-tests.log\n"
    - name: Verify actual renderer and Arabic coverage
      if: always()
      shell: bash
      run: "mkdir -p build/search-diagnostics\npython3 - <<'PYCODE'\nfrom pathlib import Path\nimport json,os,subprocess\nudid=os.environ.get('MIKSHAT_SIMULATOR_UDID')\n\
        bundle=os.environ.get('MIKSHAT_RENDERER_APP_ID')\nentries=[]\nif udid and bundle:\n    result=subprocess.run(['xcrun','simctl','get_app_container',udid,bundle,'data'],capture_output=True,text=True)\n\
        \    if result.returncode==0:\n        path=Path(result.stdout.strip())/'Documents/mikshat-renderer-coverage.jsonl'\n        if path.exists():\n\
        \            contents=path.read_text()\n            Path('build/search-diagnostics/renderer-coverage.jsonl').write_text(contents)\n  \
        \          entries=[json.loads(line) for line in contents.splitlines() if line.strip()]\nvalid=[item for item in entries if item.get('event')=='renderer-ready'\
        \ and item.get('layer')=='CAMetalLayer' and str(item.get('language','')).startswith('ar')\n       and item.get('direction')=='RTL' and\
        \ item.get('rendererReady') and item.get('graphicsReady') and item.get('active')]\ngps=sum(item.get('event')=='gps-ready' and item.get('syntheticPosition')\
        \ is True\n        and item.get('freshLocationAvailable') is True for item in entries)\ngps_failures=sum(item.get('event')=='gps-setup-failed'\
        \ for item in entries)\nindicators=sum(item.get('event')=='history-indicator-attached' and item.get('freshLocationAvailable') is True\
        \ for item in entries)\nconfirmed=len(valid)>=2 and gps>=2 and gps_failures==0 and indicators>0\nreport=dict(entries=len(entries),validatedEntries=len(valid),syntheticGpsReadyEntries=gps,gpsSetupFailures=gps_failures,\n\
        \            historyIndicatorEntries=indicators,coverageConfirmed=confirmed,\n            requirement='Both tests must confirm active\
        \ Drape/Metal, Arabic/RTL and fresh synthetic GPS, with attached history indicators and no GPS setup failure')\nfootprints=[item['physicalFootprintBytes']\
        \ for item in entries\n            if isinstance(item.get('physicalFootprintBytes'),int) and item['physicalFootprintBytes']>0]\nreport['memory']=dict(samples=len(footprints),\n\
        \                      minimumBytes=min(footprints) if footprints else None,\n                      peakBytes=max(footprints) if footprints\
        \ else None,\n                      firstToLastDeltaBytes=footprints[-1]-footprints[0] if footprints else None,\n                    \
        \  scope='Samples during foreground search and renderer activity; not post-release measurements, a leak threshold, or physical-device\
        \ Jetsam evidence')\nPath('build/search-diagnostics/renderer-coverage-summary.json').write_text(json.dumps(report,indent=2)+'\\n')\nprint(json.dumps(report))\n\
        if not confirmed:\n    raise SystemExit('Normal renderer / Arabic / fresh synthetic GPS coverage not established. This is not proof of\
        \ a search failure or fix.')\nPYCODE\n"
    - name: Collect app crash reports and simulator log
      if: always()
      shell: bash
      run: "mkdir -p build/search-diagnostics/crash-reports\npython3 - <<'PY'\nfrom pathlib import Path\nimport json,shutil\nsource = Path.home()\
        \ / 'Library/Logs/DiagnosticReports'\ndestination = Path('build/search-diagnostics/crash-reports')\nsummaries=[]\nif source.exists():\n\
        \    for report in source.rglob('*'):\n        if report.is_file() and report.suffix in ('.ips', '.crash', '.hang'):\n            if any(name\
        \ in report.name.lower() for name in ('organic', 'omaps')):\n                shutil.copy2(report, destination / report.name)\n       \
        \         summary=dict(file=report.name)\n                if report.suffix=='.ips':\n                    try:\n                      \
        \  # .ips commonly contains a metadata JSON object\n                        # followed by a separate crash payload object.\n         \
        \               remainder=report.read_text(errors='replace').lstrip()\n                        objects=[]\n                        decoder=json.JSONDecoder()\n\
        \                        while remainder:\n                            value,offset=decoder.raw_decode(remainder)\n                  \
        \          objects.append(value)\n                            remainder=remainder[offset:].lstrip()\n                        payload=next((value\
        \ for value in reversed(objects) if isinstance(value,dict) and 'threads' in value),{})\n                        index=payload.get('faultingThread')\n\
        \                        threads=payload.get('threads',[])\n                        thread=threads[index] if isinstance(index,int) and\
        \ 0<=index<len(threads) else next((value for value in threads if value.get('triggered')), {})\n                        images=payload.get('usedImages',[])\n\
        \                        frames=[]\n                        for frame in thread.get('frames',[])[:30]:\n                            image_index=frame.get('imageIndex')\n\
        \                            image=images[image_index].get('name') if isinstance(image_index,int) and 0<=image_index<len(images) else\
        \ None\n                            frames.append(dict(symbol=frame.get('symbol'),image=image,offset=frame.get('imageOffset')))\n    \
        \                    summary.update(process=payload.get('procName'),exception=payload.get('exception'),termination=payload.get('termination'),\n\
        \                                       faultingThread=index,firstFrames=frames)\n                    except (ValueError,TypeError,KeyError)\
        \ as error:\n                        summary['parseError']=str(error)\n                summaries.append(summary)\nPath('build/search-diagnostics/crash-report-summary.json').write_text(json.dumps(summaries,indent=2)+'\\\
        n')\nfor summary in summaries:\n    print('Mikshat crash summary: '+json.dumps(summary))\nPY\nif [[ -n \"${MIKSHAT_SIMULATOR_UDID:-}\"\
        \ ]]; then\n  xcrun simctl spawn \"$MIKSHAT_SIMULATOR_UDID\" log show --last 30m --info --style compact \\\n    --predicate 'process CONTAINS[c]\
        \ \"Organic\" OR process CONTAINS[c] \"OMaps\"' \\\n    > build/search-diagnostics/simulator-app.log 2>&1 || true\nfi\n"
    - name: Upload rendered-search logs and result bundles
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mikshat-search-renderer-${{ github.run_id }}
        retention-days: 7
        if-no-files-found: warn
        path: 'build/search-diagnostics/

          build/RendererBuild.xcresult/

          build/NativeSearchRecheck.xcresult/

          build/RendererArabicSearch.xcresult/'
    - name: Record current source timestamps for the next incremental build
      if: always()
      shell: bash
      run: "if [[ -f build/search-diagnostics/cache-input-mtimes.py && -d build/SearchDerivedData/Build ]]; then\n  python3 build/search-diagnostics/cache-input-mtimes.py\
        \ record\nfi\n"
    - name: Save compiled objects even when a test or test compilation fails
      if: always() && hashFiles('build/SearchDerivedData/mikshat-input-mtimes.json') != ''
      timeout-minutes: 4
      uses: actions/cache/save@v4
      with:
        path: build/SearchDerivedData
        key: mikshat-search-derived-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MIKSHAT_XCODE_CACHE_ID }}-${{ github.sha }}-${{ github.run_id
          }}-${{ github.run_attempt }}
