name: Mukshat native diagnostic log
on:
  workflow_dispatch:
  push:
    branches: ['prototype/flutter-1.0']
    paths: ['.github/workflows/prototype-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read saved emulator evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41199845108 --repo mukshatapp/mikshat-ios --name Mukshat-1.0-native-test-evidence --dir evidence
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('evidence')
          for file in root.rglob('*logcat*'):
              lines=file.read_text(errors='replace').splitlines()
              selected=[]
              for index,line in enumerate(lines):
                  if re.search(r'Mikshat|Mukshat|OrganicMaps|organicmaps|AndroidRuntime|flutter|dlopen|NoClassDef|Unsatisfied',line):
                      selected.extend(lines[max(0,index-1):min(len(lines),index+5)])
              unique=list(dict.fromkeys(selected))
              print('\n'.join(unique[-650:]))
          PY
