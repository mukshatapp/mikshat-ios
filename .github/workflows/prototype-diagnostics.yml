name: Mukshat native diagnostic log
on:
  workflow_dispatch:
  push:
    branches: ['prototype/flutter-1.0']
    paths: ['.github/workflows/prototype-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read successful emulator map screenshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41202644395 --repo mukshatapp/mikshat-ios --name Mukshat-1.0-native-test-evidence --dir evidence
          python3 - <<'PY'
          from pathlib import Path
          import base64,textwrap
          file=next(Path('evidence').rglob('native-map.png'))
          value=base64.b64encode(file.read_bytes()).decode()
          print('MUKSHAT_IMAGE_BEGIN')
          for line in textwrap.wrap(value,12000): print(line)
          print('MUKSHAT_IMAGE_END')
          PY
