name: Mukshat iOS simulator runtime proof
on:
  workflow_dispatch:
  push:
    branches: ['prototype/flutter-1.0']
    paths: ['.github/workflows/prototype-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Download the compiled simulator app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41244059829 --repo mukshatapp/mikshat-ios --name Mukshat-1.0-iOS-simulator --dir "$RUNNER_TEMP/mukshat-simulator"
      - name: Launch on an iPhone simulator and capture the actual map
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mukshat-simulator'
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mukshat-proof'
          proof.mkdir()
          app = next(root.rglob('Runner.app'))
          data = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          candidates = [(runtime,device) for runtime,devices in data['devices'].items()
                        if '.iOS-' in runtime for device in devices if 'iPhone' in device['name']]
          if not candidates: raise SystemExit('No available iPhone simulator runtime')
          runtime, device = sorted(candidates,key=lambda item:item[0])[-1]
          uid = device['udid']
          print('Simulator:', device['name'], runtime)
          if device['state'] != 'Booted':
              subprocess.run(['xcrun','simctl','boot',uid],check=True)
          subprocess.run(['xcrun','simctl','bootstatus',uid,'-b'],check=True,timeout=240)
          subprocess.run(['xcrun','simctl','install',uid,str(app)],check=True)
          log = proof / 'console.log'
          with log.open('w') as output:
              process = subprocess.Popen(['xcrun','simctl','launch','--console-pty','--terminate-running-process',uid,'com.mikshat.prototype'],stdout=output,stderr=subprocess.STDOUT)
              time.sleep(35)
              alive = process.poll() is None
              screenshot = proof / 'native-map.png'
              subprocess.run(['xcrun','simctl','io',uid,'screenshot',str(screenshot)],check=True)
              if alive:
                  process.terminate()
                  try: process.wait(timeout=10)
                  except subprocess.TimeoutExpired: process.kill()
          print(log.read_text(errors='replace')[-22000:])
          (proof / 'result.txt').write_text('App stayed alive after launch: '+str(alive)+'\n')
          print('MUKSHAT_IOS_IMAGE_BEGIN')
          encoded = base64.b64encode(screenshot.read_bytes()).decode()
          for start in range(0,len(encoded),12000): print(encoded[start:start+12000])
          print('MUKSHAT_IOS_IMAGE_END')
          if not alive: raise SystemExit('The simulator app exited before the runtime check')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mukshat-1.0-iOS-runtime-evidence
          path: ${{ runner.temp }}/mukshat-proof/
          retention-days: 14
