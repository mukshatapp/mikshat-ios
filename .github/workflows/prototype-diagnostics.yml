name: Inspect iOS prototype crash report
on:
  workflow_dispatch:
  push:
    branches: ['prototype/flutter-1.0']
    paths: ['.github/workflows/prototype-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the existing simulator evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41246613238 --repo mukshatapp/mikshat-ios --name Mukshat-1.0-iOS-runtime-evidence --dir "$RUNNER_TEMP/proof"
          python3 - <<'PY'
          import json, os, pathlib
          for report in (pathlib.Path(os.environ['RUNNER_TEMP'])/'proof').rglob('Runner*.ips'):
              raw=report.read_text(errors='replace')
              data=json.loads(raw.split('\n',1)[1])
              thread=data['threads'][data['faultingThread']]
              print('Report:',report.name)
              print('Exception:',json.dumps(data.get('exception')))
              print('Faulting thread:',thread.get('name'),thread.get('queue'))
              for frame in thread.get('frames',[]):
                  index=frame.get('imageIndex')
                  image=data.get('usedImages',[])[index] if index is not None else {}
                  print(json.dumps({'symbol':frame.get('symbol'),'offset':frame.get('symbolLocation'),
                                    'imageOffset':frame.get('imageOffset'),'image':image.get('name'),
                                    'path':image.get('path')}))
              for frame in data.get('lastExceptionBacktrace',[]): print('ObjC exception:',frame)
          PY
