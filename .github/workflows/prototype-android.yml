name: Mukshat Flutter 1.0 Android
on:
  workflow_dispatch:
  push:
    branches: ['prototype/flutter-1.0']
    paths: ['prototype/flutter-1.0/**', '.github/workflows/prototype-android.yml']
permissions:
  contents: read
concurrency:
  group: mukshat-prototype-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: prototype/flutter-1.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            prototype/flutter-1.0
            .github/workflows
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Analyze and test Flutter
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter analyze
          flutter test
      - name: Prepare verified Organic Maps engine and MWM data
        run: python3 scripts/prepare_native.py
      - name: Build internal ARM64 test APK
        env:
          ORG_GRADLE_PROJECT_prototypeAbis: arm64-v8a
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Mukshat-1.0-Android-internal
          path: prototype/flutter-1.0/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
