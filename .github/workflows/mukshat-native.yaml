name: Mukshat native compatibility build
on:
  push:
    branches: [codex/mukshat-organic-26112401, codex/mukshat-android-maps-26112504, codex/mukshat-map-ui-fixes-26112801, codex/mukshat-map-details-26112802]
  workflow_dispatch:
concurrency:
  group: mukshat-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK and CMake
        run: |
          sdkmanager 'ndk;29.0.14206865' 'cmake;3.31.6'
      - name: Check GPS render timing policy
        run: |
          g++ -std=c++23 -I libs tools/mukshat/motion_timing_test.cpp -o /tmp/motion-timing-test
          /tmp/motion-timing-test
          g++ -std=c++23 -I libs tools/mukshat/direct_guide_anchor_test.cpp -o /tmp/direct-guide-anchor-test
          /tmp/direct-guide-anchor-test
      - name: Verify all preserved JNI declarations
        run: |
          python3 tools/mukshat/verify_jni_contract.py
          python3 tools/mukshat/verify_java_callbacks.py
          python3 tools/mukshat/detail_policy_test.py
          python3 tools/mukshat/placepage_legacy_enum_test.py
          python3 tools/mukshat/maponly_storage_test.py
          python3 tools/mukshat/test_legacy_gui.py --source-root .
          python3 tools/mukshat/test_legacy_transit_symbols.py --source-root .
          bash tools/mukshat/test_geographic_presentation.sh
          python3 tools/mukshat/test_detail_visibility.py
          python3 tools/mukshat/generate_map_caption_labels.py --check
          g++ -std=c++23 -Wall -Wextra -Werror -I libs tools/mukshat/caption_fallback_test.cpp -o /tmp/caption-fallback-test
          /tmp/caption-fallback-test
          bash tools/mukshat/test_reserve_geometry.sh
      - name: Build native engine for the preserved Mukshat SDK
        env:
          ABI: ${{ matrix.abi }}
        run: |
          cmake -S . -B build-mukshat -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$ANDROID_HOME/cmake/3.31.6/bin/ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DSKIP_TOOLS=ON -DSKIP_QT_GUI=ON \
            -DUSE_PCH=OFF -DMUKSHAT_LEGACY_SDK_ABI=ON
          cmake --build build-mukshat --target organicmaps --parallel 3
          mkdir -p "artifact/$ABI"
          find build-mukshat -name liborganicmaps.so -exec cp '{}' "artifact/$ABI/" \;
          test -s "artifact/$ABI/liborganicmaps.so"
          "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "artifact/$ABI/liborganicmaps.so"
          "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "artifact/$ABI/liborganicmaps.so" > "artifact/$ABI/ELF-HEADER.txt"
          python3 tools/mukshat/verify_android_native.py --library "artifact/$ABI/liborganicmaps.so" --ndk "$ANDROID_HOME/ndk/29.0.14206865" --abi "$ABI" --api 21 --output "artifact/$ABI/API21-VERIFICATION.json"
          sha256sum "artifact/$ABI/liborganicmaps.so" > "artifact/$ABI/SHA256.txt"
          git rev-parse HEAD > "artifact/$ABI/SOURCE-COMMIT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mukshat-native-api21-${{ matrix.abi }}
          path: artifact/
          retention-days: 14
